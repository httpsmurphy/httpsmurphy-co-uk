<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop history · httpsmurphy</title>
<meta name="description" content="Drop history for Pokémon Center UK, John Lewis, Very, Asda, Hamleys and Miniso: when each one dropped and what went live.">
<link rel="icon" href="icons/murphaco.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/v2.css">
<script src="assets/drops-data.js"></script>
<script src="assets/retail-data.js"></script>
<script src="assets/site.js"></script>
</head>
<body class="v2">
<main>

<section class="rip" aria-label="Pick a retailer">
  <div class="wrap rip-head"><span class="label">Drop history · pick a retailer</span></div>
  <div class="rip-view" id="rip" tabindex="0"><div class="rip-track" id="sites"></div></div>
</section>

<div id="pkc">
<section class="dh-top"><div class="wrap dh-grid">
  <div>
    <span class="label" id="h-label"></span>
    <div class="since"><span class="n" id="c-d">0</span><span class="disp">days since<br>the last drop</span></div>
    <div class="tick" id="c-all"></div>
    <h1 class="dh-line" id="d-head"></h1>
  </div>
  <div class="dh-side">
    <div><span class="label">usual day</span><b class="disp" id="f-day"></b></div>
    <div><span class="label" id="f-win-l"></span><b class="disp" id="f-win"></b></div>
    <button type="button" class="btn" id="f-more" aria-expanded="false" aria-controls="pat">Show the patterns</button>
  </div>
</div></section>

<section id="pat" hidden><div class="wrap"><div class="trio pat">
  <div class="inst">
    <span class="label">Pattern · 01</span>
    <h2>Are we in the window?</h2>
    <div class="win" id="win"></div>
    <span class="status" id="win-status"></span>
    <p class="sub" id="win-sub"></p>
  </div>
  <div class="inst">
    <span class="label">Pattern · 02</span>
    <h2>Which day</h2>
    <div class="days" id="days"></div>
    <p class="sub" id="days-sub"></p>
  </div>
  <div class="inst">
    <span class="label">Pattern · 03</span>
    <h2>How long between</h2>
    <div class="gaps" id="gaps"></div>
    <p class="sub" id="gaps-sub"></p>
  </div>
</div></div></section>

<section class="field-wrap"><div class="wrap field-grid">
  <div class="cal" id="field" tabindex="0" aria-label="A calendar of every drop. Pick a filled square, or use the arrow keys to step through drops."></div>
  <div class="field-read" aria-live="polite">
    <span class="label" id="r-day"></span>
    <div class="disp" id="r-date"></div>
    <ul class="field-what" id="r-what"></ul>
    <dl class="field-dl">
      <div><dt class="label" id="r-q-l"></dt><dd class="num" id="r-q"></dd></div>
      <div id="r-live-box"><dt class="label" id="r-live-l"></dt><dd class="num" id="r-live"></dd></div>
      <div id="r-oos-box"><dt class="label">queue wait</dt><dd class="num" id="r-oos"></dd></div>
    </dl>
    <div class="field-act">
      <div class="tl-keys"><button type="button" id="tl-prev" aria-label="Earlier drop">←</button><button type="button" id="tl-next" aria-label="Later drop">→</button></div>
      <span class="label" id="r-count"></span>
    </div>
  </div>
</div>
<div class="wrap field-foot"><p class="field-key label">Every square is a day · <i class="k in"></i> <span id="key-in"></span><span id="key-pre"> · <i class="k pre"></i> pre-order</span> · <i class="k now"></i> today</p><button type="button" class="btn" id="list-btn" aria-expanded="false" aria-controls="ledger"></button></div>
</section>

<section class="ledger" id="ledger" hidden><div class="wrap">
  <div class="ledger-head">
    <div><span class="label">The record</span><h2 class="disp">Every drop.</h2></div>
    <div class="ledger-tools">
      <div class="hx-chips" id="chips" role="group" aria-label="Filter drops">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="pre" aria-pressed="false">Pre-orders</button>
        <button type="button" data-f="stock" aria-pressed="false">In stock</button>
      </div>
      <input class="ledger-q" id="q" type="search" placeholder="Search a product or set" aria-label="Search a product or set">
    </div>
  </div>
  <div class="ledger-cols label" aria-hidden="true"><span>Date</span><span id="lc-2"></span><span>What dropped</span><span id="lc-4"></span><span id="lc-5"></span></div>
  <div id="rows"></div>
  <div class="ledger-more"><button type="button" class="btn" id="all-btn"></button><span class="label" id="count"></span></div>
</div></section>
</div>

</main>
<template id="foot-right">Times are UK time, collected from public sources, and can be incomplete. Pokémon Center data from <a href="https://www.isthereadroptoday.com/drops" rel="noopener" target="_blank">isthereadroptoday.com</a>, shared under <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank">CC BY 4.0</a>. Other retailers are read from public restock monitors.</template>

        el("div", { class: "cal-head" }, [el("b", { class: "disp", text: String(yr) }), el("span", { class: "label", text: cnt + (cnt === 1 ? " drop" : " drops") }), el("span", { class: "cal-navs" }, [back, fwd])]),

    $("win-sub").textContent = (cfg.queue ? "Most queues open between " : "Most drops go live between ") + stats.window.replace("–", " and ") + ", UK time. The outlined square is now.";

    var byDay = [0, 0, 0, 0, 0, 0, 0];
    recent.forEach(function (d) { byDay[new Date(Date.parse(d.date)).getUTCDay()]++; });
    var dmax = Math.max.apply(null, byDay), dbox = $("days"); dbox.textContent = "";
    [1, 2, 3, 4, 5, 6, 0].forEach(function (d) {
      var f = el("i"); f.style.setProperty("--w", byDay[d] / dmax * 100 + "%");
      dbox.append(el("div", { class: "dr" + (byDay[d] === dmax ? " top" : "") }, [el("span", { text: Drops.DAYS[d].slice(0, 3) }), el("div", { class: "t" }, [f]), el("b", { text: String(byDay[d]) })]));
    });
    $("days-sub").textContent = stats.topDayN + " of the last " + stats.sample + " drops were on a " + stats.topDay + "." + (byDay[0] + byDay[6] ? "" : " None at the weekend.");

    var avg = Math.round(stats.avgGap), over = Math.floor(sinceDays) - avg, dh = $("d-head"); dh.textContent = "";
    dh.append("They drop every ", el("em", { text: avg + " days" }), " on average. ", over > 0 ? "We're " + over + " past that." : over < 0 ? "We're " + (-over) + " short of that." : "That's today.");
    $("h-label").textContent = cfg.name + " · drop history";
    $("f-win-l").textContent = cfg.queue ? "queue usually opens" : "usually goes live";
    $("f-day").textContent = stats.topDay; $("f-win").textContent = stats.window.replace("–", " – ");
    $("r-q-l").textContent = cfg.queue ? "queue" : "went live"; $("r-live-l").textContent = cfg.queue ? "went live" : "products";
    $("key-in").textContent = cfg.queue ? "in-stock drop" : "drop"; $("key-pre").hidden = !cfg.queue;
    $("lc-2").textContent = cfg.queue ? "Queue" : "Went live"; $("lc-4").textContent = cfg.queue ? "Went live" : "Products"; $("lc-5").textContent = cfg.queue ? "Queue wait" : "";
    $("chips").hidden = !cfg.queue;
    filter = "all"; query = ""; showAll = !led.hidden; $("q").value = ""; setChips();
    calendar(); patterns(); draw(); listLabel();
  }

  // ---- the retailer row ----
  var sbox = $("sites"), view = $("rip"), cards = [], sx = 0, sv = 0, amp = 0, rheld = null, rmoved = false, rraf = 0, goal = null;
  function pickSite(n) {
    cards.forEach(function (c, i) { c.setAttribute("aria-pressed", i === n ? "true" : "false"); });
    show(n);
    // slide the row so the one you picked sits in the middle (as far as the ends allow)
    var c = cards[n]; if (c) { goal = Math.max(0, Math.min(limit(), c.offsetLeft + c.offsetWidth / 2 - view.clientWidth / 2)); kick(); }
  }
  SITES.forEach(function (site, i) {
    var c = el("button", { class: "rip-card", type: "button", "aria-pressed": i ? "false" : "true" }, [
      el("span", { class: "label", text: String(i + 1).padStart(2, "0") }), el("b", { class: "disp", text: site[0] }), el("small", { text: site[1].drops.length + " drops" })]);
    c.addEventListener("click", function () { if (!rmoved) pickSite(i); });
    sbox.append(c); cards.push(c);
  });
  // ripple: move it quickly and a wave runs along the row; it settles when you stop
  function limit() { return Math.max(0, sbox.scrollWidth - view.clientWidth); }
  function rframe() {
    if (goal !== null && !rheld) { sv = (goal - sx) * .13; if (Math.abs(goal - sx) < .6) { sx = goal; sv = 0; goal = null; } }
    sx = Math.max(-60, Math.min(limit() + 60, sx + sv)); sv *= .93;
    if (!rheld) { if (sx < 0) sx += (0 - sx) * .2; if (sx > limit()) sx += (limit() - sx) * .2; }
    amp += (Math.min(44, Math.abs(sv) * 2.4) - amp) * .12;
    sbox.style.transform = "translateX(" + (-sx) + "px)";
    cards.forEach(function (c, i) {
      var ph = i * .85 - sx / 70;
      c.style.transform = "translateY(" + Math.sin(ph) * amp + "px) rotate(" + Math.cos(ph) * amp * .11 + "deg) scale(" + (1 + Math.sin(ph) * amp * .0022) + ")";
    });
    if (goal !== null || Math.abs(sv) > .05 || amp > .2 || rheld || sx < 0 || sx > limit()) rraf = requestAnimationFrame(rframe); else { rraf = 0; cards.forEach(function (c) { c.style.transform = ""; }); }
  }
  function kick() { if (!rraf) rraf = requestAnimationFrame(rframe); }
  view.addEventListener("pointerdown", function (e) { rheld = { x: e.clientX, last: e.clientX }; rmoved = false; goal = null; document.body.classList.add("grabbing"); kick(); });
  window.addEventListener("pointermove", function (e) { if (!rheld) return; var dx = rheld.last - e.clientX; rheld.last = e.clientX; if (Math.abs(e.clientX - rheld.x) > 5) rmoved = true; sx += dx; sv = dx; });
  window.addEventListener("pointerup", function () { if (!rheld) return; rheld = null; document.body.classList.remove("grabbing"); kick(); setTimeout(function () { rmoved = false; }, 0); });
  view.addEventListener("wheel", function (e) { var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : 0; if (!d) return; e.preventDefault(); goal = null; sv += d * .12; kick(); }, { passive: false });
  view.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") { goal = null; sv += 14; kick(); } if (e.key === "ArrowLeft") { goal = null; sv -= 14; kick(); } });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setTimeout(function () { sv = 16; kick(); setTimeout(function () { sv = -16; kick(); }, 520); }, 500);

  show(0);
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: .15 });
  document.querySelectorAll(".rise").forEach(function (n) { io.observe(n); });
});
</script>
